apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-granite-8b-gpu
  namespace: fleet-llm-d
  labels:
    app: vllm-granite-8b-gpu
    fleet.llm-d.ai/model: granite-3.1-8b
    fleet.llm-d.ai/runtime: vllm
    fleet.llm-d.ai/hardware: gpu-nvidia-h100
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-granite-8b-gpu
  template:
    metadata:
      labels:
        app: vllm-granite-8b-gpu
        fleet.llm-d.ai/model: granite-3.1-8b
        fleet.llm-d.ai/runtime: vllm
        fleet.llm-d.ai/hardware: gpu-nvidia-h100
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
          args:
            - "--model=ibm-granite/granite-3.1-8b-instruct"
            - "--dtype=bfloat16"
            - "--max-model-len=8192"
            - "--port=8000"
            - "--gpu-memory-utilization=0.85"
            - "--tensor-parallel-size=1"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HOME
              value: /tmp
            - name: USER
              value: vllm
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
        - name: tls-proxy
          image: docker.io/nginxinc/nginx-unprivileged@sha256:0ae19f15f7aac55c1c6d3019009d7d5a83ad1ee2af90ad9f04a89aaab0baf85b
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: tls-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: vllm-granite-8b-gpu-tls
        - name: tls-proxy-config
          configMap:
            name: vllm-granite-8b-gpu-tls-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-granite-8b-gpu
  namespace: fleet-llm-d
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: vllm-granite-8b-gpu-tls
  labels:
    app: vllm-granite-8b-gpu
    fleet.llm-d.ai/model: granite-3.1-8b
    fleet.llm-d.ai/runtime: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm-granite-8b-gpu
  ports:
    - port: 8000
      targetPort: 8000
      name: http
    - port: 8443
      targetPort: https
      name: https
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-granite-8b-gpu-tls-proxy
  namespace: fleet-llm-d
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/tls/tls.crt;
        ssl_certificate_key /etc/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;
        location / {
          proxy_pass http://127.0.0.1:8000;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_request_buffering off;
          proxy_buffering off;
          proxy_read_timeout 180s;
          proxy_send_timeout 180s;
        }
      }
    }

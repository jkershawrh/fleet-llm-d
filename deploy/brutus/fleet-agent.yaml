apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-agent
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: fleet-agent
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/fleet-agent@sha256:c6da51ce92cc506ff2b46c776adc80a260254554299c24c93ad44e9f303ccd79
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLEET_CONTROL_PLANE_URL
              value: https://fleet-controller-fleet-llm-d.apps.oberon.fm2aihpcsed.com
            - name: FLEET_CLUSTER_ID
              value: brutus-h100
            - name: FLEET_PROXY_PORT
              value: "8090"
            - name: FLEET_TLS_INSECURE_SKIP_VERIFY
              value: "true"
            - name: FLEET_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fleet-agent-auth
                  key: FLEET_CONTROL_PLANE_TOKEN
            - name: FLEET_LOCAL_PROMETHEUS_URL
              value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000/metrics
            - name: FLEET_GPU_TOTAL
              value: "1"
            - name: FLEET_GPU_AVAILABLE
              value: "1"
            - name: FLEET_CLUSTER_HEALTH_URL
              value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000/health
            - name: FLEET_CLUSTER_INFERENCE_URL
              value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000
            - name: FLEET_UPSTREAM_URL
              value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000
          ports:
            - name: proxy
              containerPort: 8090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: proxy
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # Agent process readiness; vLLM health is reported separately.
              path: /healthz
              port: proxy
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-agent
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fleet-agent
    app.kubernetes.io/component: agent
  ports:
    - name: proxy
      port: 8090
      targetPort: proxy
      protocol: TCP

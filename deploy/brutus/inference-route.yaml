apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-granite-8b-gpu
  namespace: fleet-llm-d
  labels:
    app: vllm-granite-8b-gpu
    fleet.llm-d.ai/purpose: cross-cluster-inference
  annotations:
    haproxy.router.openshift.io/timeout: 180s
    haproxy.router.openshift.io/haproxy.health.check.interval: 5s
spec:
  to:
    kind: Service
    name: vllm-granite-8b-gpu
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

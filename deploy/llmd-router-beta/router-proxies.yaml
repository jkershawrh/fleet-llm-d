apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-router-cpu-proxy
  namespace: fleet-llm-d
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-router-cpu-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fleet-router-cpu-proxy}
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: fleet-router-cpu-proxy}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: fleet-router-cpu-proxy}
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy@sha256:0d8c8b3fc3250b5f664dd93ac305738f9c4e6ff38fcb8499088cca1b827f787e
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - {name: http, containerPort: 8081}
            - {name: readiness, containerPort: 19001}
          readinessProbe:
            httpGet: {path: /ready, port: readiness}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ready, port: readiness}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: envoy-config, mountPath: /etc/envoy, readOnly: true}
            - {name: route-ca, mountPath: /etc/fleet/route-ca, readOnly: true}
      volumes:
        - name: envoy-config
          configMap: {name: fleet-router-cpu-envoy}
        - name: route-ca
          configMap: {name: fleet-route-ca}
---

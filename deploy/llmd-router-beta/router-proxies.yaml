apiVersion: v1
kind: Service
metadata: {name: fleet-router-cpu-proxy, namespace: fleet-llm-d}
spec:
  selector: {app.kubernetes.io/name: fleet-router-cpu-proxy}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: fleet-router-gpu-proxy, namespace: fleet-llm-d}
spec:
  selector: {app.kubernetes.io/name: fleet-router-gpu-proxy}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: fleet-router-cpu-proxy, namespace: fleet-llm-d}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-router-cpu-proxy}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: fleet-router-gpu-proxy, namespace: fleet-llm-d}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fleet-router-gpu-proxy}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: fleet-router-proxies, namespace: fleet-llm-d}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [fleet-router-cpu-proxy, fleet-router-gpu-proxy]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: fleet-router-qualification-gateway}
      ports: [{port: 8081, protocol: TCP}]
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
    - to:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [fleet-router-cpu-epp, fleet-router-gpu-epp]}
      ports: [{port: 9002, protocol: TCP}]
    - ports: [{port: 443, protocol: TCP}]

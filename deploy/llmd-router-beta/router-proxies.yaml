apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-router-cpu-envoy
  namespace: fleet-llm-d
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 19000}
    static_resources:
      listeners:
        - name: readiness
          address:
            socket_address: {address: 0.0.0.0, port_value: 19001}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: readiness
                    route_config:
                      name: readiness
                      virtual_hosts:
                        - name: readiness
                          domains: ["*"]
                          routes:
                            - match: {path: /ready}
                              direct_response: {status: 200}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: inference
          address:
            socket_address: {address: 0.0.0.0, port_value: 8081}
          per_connection_buffer_limit_bytes: 32768
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: inference
                    route_config:
                      name: inference
                      virtual_hosts:
                        - name: inference
                          domains: ["*"]
                          routes:
                            - match: {prefix: /}
                              route:
                                cluster: selected_route
                                timeout: 180s
                                idle_timeout: 180s
                                host_rewrite_header: x-gateway-destination-endpoint
                                retry_policy:
                                  retry_on: connect-failure,reset,refused-stream
                                  num_retries: 1
                                  per_try_timeout: 10s
                              response_headers_to_add:
                                - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                  header:
                                    key: x-fleet-router-upstream
                                    value: "%REQ(X-GATEWAY-DESTINATION-ENDPOINT)%"
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              function envoy_on_request(handle)
                                handle:headers():remove("x-gateway-destination-endpoint")
                                handle:headers():remove("x-gateway-destination-endpoint-subset")
                              end
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          failure_mode_allow: false
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc
                              authority: fleet-router-cpu-epp.fleet-llm-d.svc:9002
                            timeout: 10s
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 180s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
                    normalize_path: true
                    merge_slashes: true
                    common_http_protocol_options:
                      headers_with_underscores_action: REJECT_REQUEST
      clusters:
        - name: selected_route
          type: ORIGINAL_DST
          connect_timeout: 10s
          lb_policy: CLUSTER_PROVIDED
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-gateway-destination-endpoint
          circuit_breakers:
            thresholds:
              - max_connections: 256
                max_pending_requests: 256
                max_requests: 512
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              upstream_http_protocol_options:
                auto_sni: true
                auto_san_validation: true
              explicit_http_config:
                http_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/fleet/route-ca/ca-bundle.crt
        - name: ext_proc
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: LEAST_REQUEST
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ext_proc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: fleet-router-cpu-epp.fleet-llm-d.svc
                          port_value: 9002
---

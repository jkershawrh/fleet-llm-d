router:
  inferencePool:
    create: false
  proxy:
    enabled: false
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: main
      pullPolicy: Always
    flags:
      allow-experimental-plugins: true
      v: 2
    pluginsConfigFile: multicluster.yaml
    pluginsCustomConfig:
      multicluster.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: multicluster-file-discovery
            name: discovery
            parameters:
              path: /var/run/fleet-router/endpoints-25edf1e35996.json
              watchFile: true
          - type: multicluster-metrics-data-source
            name: grid-signals
            parameters:
              scheme: https
              path: /metrics
              interval: 5s
              insecureSkipVerify: false
              caCertPath: /var/run/grid-signals/ca/ca.crt
              clientCertPath: /var/run/grid-signals/client/tls.crt
              clientKeyPath: /var/run/grid-signals/client/tls.key
          - type: openai-parser
          - type: random-picker
        dataLayer:
          discovery:
            endpoints:
              pluginRef: discovery
          sources:
            - pluginRef: grid-signals
        requestHandler:
          parsers:
            - pluginRef: openai-parser
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: random-picker
    volumes:
      - name: fleet-router-endpoints
        configMap:
          name: fleet-router-endpoints
      - name: grid-signals-route-ca
        secret:
          secretName: grid-signals-route-ca
      - name: grid-signals-epp-client
        secret:
          secretName: grid-signals-epp-client
    volumeMounts:
      - name: fleet-router-endpoints
        mountPath: /var/run/fleet-router
        readOnly: true
      - name: grid-signals-route-ca
        mountPath: /var/run/grid-signals/ca
        readOnly: true
      - name: grid-signals-epp-client
        mountPath: /var/run/grid-signals/client
        readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  modelServers:
    type: vllm
    protocol: http
    matchLabels:
      fleet.llm-d.ai/shadow-router: never
    targetPorts:
      - number: 443
  monitoring:
    prometheus:
      enabled: false

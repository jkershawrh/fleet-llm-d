apiVersion: v1
kind: PersistentVolume
metadata:
  name: oberon-model-cache
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadOnlyMany
  nfs:
    server: 192.168.1.199
    path: /mnt/nfs/triforce-huggingface-model-cache-pvc-eb6b8194-939c-455c-8ab3-192d8ed0a17b
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oberon-model-cache
  namespace: fleet-llm-d
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 200Gi
  volumeName: oberon-model-cache
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms-granite-2b
  namespace: fleet-llm-d
  labels:
    app: ovms-granite-2b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovms-granite-2b
  template:
    metadata:
      labels:
        app: ovms-granite-2b
    spec:
      containers:
        - name: ovms
          image: docker.io/openvino/model_server@sha256:069a1c1191995e2b1338879137efc9551829e47f1d2e97049004453a6076d898
          args:
            - --model_name
            - granite-2b-cpu
            - --model_path
            - /models/ov/granite-2b
            - --rest_port
            - "8080"
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
        - name: tls-proxy
          image: docker.io/nginxinc/nginx-unprivileged@sha256:0ae19f15f7aac55c1c6d3019009d7d5a83ad1ee2af90ad9f04a89aaab0baf85b
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: tls-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: oberon-model-cache
        - name: tls
          secret:
            secretName: ovms-granite-2b-tls
        - name: tls-proxy-config
          configMap:
            name: ovms-granite-2b-tls-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: ovms-granite-2b
  namespace: fleet-llm-d
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: ovms-granite-2b-tls
  labels:
    app: ovms-granite-2b
spec:
  type: ClusterIP
  selector:
    app: ovms-granite-2b
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8443
      targetPort: https
      name: https
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovms-granite-2b-tls-proxy
  namespace: fleet-llm-d
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/tls/tls.crt;
        ssl_certificate_key /etc/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;
        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_request_buffering off;
          proxy_buffering off;
          proxy_read_timeout 180s;
          proxy_send_timeout 180s;
        }
      }
    }

# Network policies for fleet-llm-d on Arena (CPU spoke, OVN-Kubernetes).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fleet-llm-d
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-agent-egress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-agent
  policyTypes:
    - Egress
  egress:
    # The spoke agent must reach DNS, the Kubernetes API, local inference,
    # and the external Oberon control plane. Keep this broad allowance scoped
    # to the fleet-agent label; default-deny remains in force for other pods.
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-agent-ingress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-agent
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8090
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-granite-inference-egress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app: ovms-granite-2b
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-granite-inference-ingress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app: ovms-granite-2b
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-agent
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP

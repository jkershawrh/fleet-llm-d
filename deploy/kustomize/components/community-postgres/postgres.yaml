apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-postgres
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 1
  serviceName: fleet-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              value: fleet
            - name: POSTGRES_USER
              value: fleet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-postgres
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fleet"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-postgres
  namespace: fleet-llm-d
spec:
  selector:
    app.kubernetes.io/name: fleet-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - router-endpoints.yaml
patches:
  - target:
      kind: Deployment
      name: fleet-controller
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --routing-provider=llm-d-router
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LLMD_ROUTER_ENDPOINTS_CONFIGMAP
          value: fleet-router-endpoints

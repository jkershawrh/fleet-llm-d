apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-llm-d
resources:
  - ../../base-spoke
images:
  - name: ghcr.io/llm-d/fleet-agent
    newName: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/fleet-agent
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: fleet-agent
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fleet-agent
      spec:
        template:
          spec:
            containers:
              - name: fleet-agent
                imagePullPolicy: Always
                env:
                  - name: FLEET_CONTROL_PLANE_URL
                    value: FLEET_CONTROL_PLANE_URL_PLACEHOLDER
                  - name: FLEET_CLUSTER_ID
                    value: brutus-h100
                  - name: FLEET_ROUTING_ENDPOINT
                    value: https://vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com
                  - name: FLEET_ROUTING_METRICS_ENDPOINT
                    value: https://vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com
                  - name: FLEET_ROUTING_TLS_SERVER_NAME
                    value: vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com
                  - name: FLEET_TLS_INSECURE_SKIP_VERIFY
                    value: "true"
                  - name: FLEET_CLUSTER_HEALTH_URL
                    value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000/health
                  - name: FLEET_CLUSTER_INFERENCE_URL
                    value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000
                  - name: FLEET_UPSTREAM_URL
                    value: http://vllm-granite-8b-gpu.fleet-llm-d.svc:8000

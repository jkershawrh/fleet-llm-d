apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-certification-telemetry-api-egress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-certification
      app.kubernetes.io/component: telemetry
  policyTypes:
    - Egress
  egress:
    # Kubernetes service traffic may be evaluated before or after DNAT across
    # supported CNIs. Limit this short-lived, read-only Job to API TLS ports;
    # RBAC remains the authoritative restriction on accessible resources.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

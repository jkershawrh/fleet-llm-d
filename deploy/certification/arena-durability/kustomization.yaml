apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-llm-d
resources:
  - ../arena-router-local
patches:
  - target:
      kind: Job
      name: fleet-router-certification-arena-local
    patch: |-
      - op: replace
        path: /metadata/name
        value: fleet-router-durability-arena-local-8h-rerun-1
      - op: add
        path: /metadata/labels/fleet.llm-d.ai~1qualification
        value: durability-8h
      - op: replace
        path: /spec/activeDeadlineSeconds
        value: 36000
      - op: replace
        path: /spec/backoffLimit
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/args/7
        value: --duration-per-level=28800
      - op: replace
        path: /spec/template/spec/containers/0/args/9
        value: --request-interval=14

apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-certification-telemetry
  namespace: fleet-llm-d
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-certification-telemetry
  namespace: fleet-llm-d
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-certification-telemetry
  namespace: fleet-llm-d
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-certification-telemetry
subjects:
  - kind: ServiceAccount
    name: fleet-certification-telemetry
    namespace: fleet-llm-d

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-certification-to-inference-gateway
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-inference-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-certification
              app.kubernetes.io/component: traffic
      ports:
        - port: 8080
          protocol: TCP

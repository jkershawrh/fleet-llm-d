apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-certification-resource-snapshot
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-certification
    app.kubernetes.io/component: telemetry
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-certification
        app.kubernetes.io/component: telemetry
    spec:
      serviceAccountName: fleet-certification-telemetry
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snapshot
          image: fleet-certification:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/fleet-certification/cluster_resource_snapshot.py"]
          args:
            - --target=$(FLEET_CERT_TARGET)
            - --namespace=$(FLEET_CERT_NAMESPACE)
            - --selector=$(FLEET_CERT_SELECTOR)
          env:
            - name: FLEET_CERT_TARGET
              value: replace-me
            - name: FLEET_CERT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLEET_CERT_SELECTOR
              value: replace-me
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi

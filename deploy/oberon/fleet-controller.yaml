---
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-llm-d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-controller
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-controller
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-controller
        app.kubernetes.io/part-of: fleet-llm-d
        fleet.llm-d.ai/leader: "false"
    spec:
      enableServiceLinks: false
      serviceAccountName: fleet-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: fleet-controller
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/fleet-controller@sha256:7d53b042d63ffc1e800cff152350cacd8fd85aa34f2104c0360d18dc5604e7dd
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - "--mode=control"
            - "--kube-api=https://kubernetes.default.svc"
            - "--namespace=fleet-llm-d"
            - "--port=8080"
            - "--metrics-port=9091"
            - "--ledger-mode=http"
            - "--ledger-endpoint=http://ledger-gateway.immutable-ledger.svc:28099"
            - "--modelplane-api=http://modelplane-mock.fleet-llm-d.svc:8090"
            - "--modelplane-namespace=default"
            - "--rate-limit=100"
            - "--rate-burst=200"
            - "--log-level=info"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9091
              name: metrics
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FLEET_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: fleet-identity
                  key: hmac-secret
            - name: GCL_DECISION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-identity
                  key: gcl-signing-key
            - name: GCL_DECISION_SIGNING_KEY_ID
              value: "fleet-llm-d-2026-08"
            - name: GCL_URL
              value: http://gcl-app.governed-cognitive-loop.svc:8000
            - name: SEMANTIC_CLASSIFIER_URL
              value: "llm-d-semantic-classifier.fleet-llm-d.svc:50051"
            - name: DEEPFIELD_URL
              value: http://deepfield-fleet.fleet-llm-d.svc:8000
            - name: LEDGER_GATEWAY_URL
              value: http://ledger-gateway.immutable-ledger.svc:28099
            - name: PG_URL
              valueFrom:
                secretKeyRef:
                  name: fleet-postgres-credentials
                  key: pg-url
            - name: GRID_NETWORK
              value: fleet-llm-d-grid
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-controller
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-controller
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-controller
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  selector:
    app.kubernetes.io/name: fleet-controller
    fleet.llm-d.ai/leader: "true"
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9091
      targetPort: 9091
      name: metrics
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fleet-controller
  namespace: fleet-llm-d
spec:
  to:
    kind: Service
    name: fleet-controller
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleet-controller
  namespace: fleet-llm-d
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-controller

# llm-d-semantic-classifier (llm-d-sc) — complexity classifier on Oberon.
# Classifies inference prompts into SIMPLE/MEDIUM/COMPLEX/REASONING
# for semantic routing. gRPC on 50051.
#
# Prerequisites:
#   1. Build and push image:
#      podman build -f Containerfile -t llm-d-sc:latest .
#      podman push llm-d-sc:latest image-registry.openshift-image-registry.svc:5000/fleet-llm-d/llm-d-sc:latest
#   2. Fetch model artifact:
#      ./hack/fetch-model --classifier complexity
#   3. Stage on Oberon:
#      scp -r artifacts/models/complexity oberon:/var/lib/models/semantic-classifier/
#      ssh oberon 'chcon -Rt container_file_t /var/lib/models/semantic-classifier/'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-semantic-classifier
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: llm-d-semantic-classifier
    app.kubernetes.io/component: classifier
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-semantic-classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-semantic-classifier
        app.kubernetes.io/component: classifier
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: llm-d-sc
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/llm-d-sc:latest
          imagePullPolicy: Always
          env:
            - name: LLM_D_SC_MODEL_DIR
              value: /models
            - name: LLM_D_SC_CLASSIFIER
              value: complexity
            - name: LLM_D_SC_LISTEN
              value: "0.0.0.0:50051"
          ports:
            - containerPort: 50051
              name: grpc
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/hostname: oberon
      volumes:
        - name: models
          hostPath:
            path: /var/lib/models/semantic-classifier
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-semantic-classifier
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: llm-d-semantic-classifier
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  selector:
    app.kubernetes.io/name: llm-d-semantic-classifier
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: llm-d-semantic-classifier
  namespace: fleet-llm-d
spec:
  to:
    kind: Service
    name: llm-d-semantic-classifier
  port:
    targetPort: grpc
  tls:
    termination: edge

# Network policies for fleet-llm-d on OpenShift OVN-Kubernetes (Oberon hub).
#
# Strategy: default-deny-all for ingress+egress, then explicit allow-list.
# Ingress: locked down to specific sources per service.
# Egress: open for control plane pods (controller, praxis, agent).
#   OVN-K cannot reliably restrict egress to ClusterIPs — ipBlock doesn't
#   match ClusterIP traffic, and namespaceSelector requires post-DNAT
#   evaluation which is inconsistent across OVN-K versions. The pragmatic
#   approach is egress: [{}] for trusted control plane components.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fleet-llm-d
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# OpenShift binary-build pods need API access during source initialization,
# HTTPS for pinned base-image pulls, DNS, and the internal registry for pushes.
# The selector is set by OpenShift only on ephemeral build pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-build-egress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchExpressions:
      - key: openshift.io/build.name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
        - ipBlock:
            cidr: 172.30.0.10/32
        - ipBlock:
            cidr: 10.128.0.0/14
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - ports:
        - port: 5000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
---
# Fleet Controller — ingress from Routes + in-namespace pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-controller-ingress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
        - port: 9091
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-controller-egress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-controller
  policyTypes:
    - Egress
  egress:
    - {}
---
# Praxis AI is internal-only. Only the authenticated inference gateway may
# submit inference requests; callers must never bypass fleet policy by
# supplying routing headers directly to Praxis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-praxis-ai-ingress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-inference-gateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1

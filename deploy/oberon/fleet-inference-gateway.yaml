apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-inference-gateway
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-inference-gateway
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-inference-gateway
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      enableServiceLinks: false
      serviceAccountName: fleet-controller
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-inference-gateway
      containers:
        - name: gateway
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/fleet-controller@sha256:bbaf44942be6e0980ee9fe129ffd14697c14c9fe037f44b05b5ba6643b669e0f
          args:
            - --mode=inference
            - --port=8080
            - --metrics-port=9091
            - --praxis-url=http://praxis-ai.fleet-llm-d.svc:8080
            - --ledger-mode=http
            - --ledger-endpoint=https://ledger-gateway.immutable-ledger.svc:443
            - --inference-max-inflight=100
            - --rate-limit=50
            - --rate-burst=100
            - --trust-proxy-headers=true
          env:
            - name: FLEET_AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: fleet-identity, key: hmac-secret}
            - name: GCL_DECISION_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: fleet-identity, key: gcl-signing-key}
            - name: GCL_DECISION_SIGNING_KEY_ID
              value: fleet-llm-d-2026-08
            - name: PG_URL
              valueFrom:
                secretKeyRef: {name: fleet-postgres-credentials, key: pg-url}
            - name: SEMANTIC_CLASSIFIER_URL
              value: llm-d-semantic-classifier.fleet-llm-d.svc:50051
            - name: FLEET_PROVIDER_HEALTH_URLS_JSON
              value: '{"oberon-cpu":"http://ovms-granite-2b.fleet-llm-d.svc:8080/v2/health/ready","arena-xeon6":"https://ovms-granite-2b-fleet-llm-d.apps.arena.fm2aihpcsed.com/v2/health/ready","brutus-h100":"https://vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com/health"}'
            - name: FLEET_PROVIDER_CA_FILE
              value: /etc/fleet/route-ca/ca-bundle.crt
            - name: LEDGER_GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef: {name: ledger-gateway-auth, key: api-token}
            - name: SSL_CERT_FILE
              value: /var/run/configmaps/ledger-service-ca/service-ca.crt
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9091}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: route-ca
              mountPath: /etc/fleet/route-ca
              readOnly: true
            - name: ledger-service-ca
              mountPath: /var/run/configmaps/ledger-service-ca
              readOnly: true
      volumes:
        - name: route-ca
          configMap:
            name: fleet-route-ca
        - name: ledger-service-ca
          configMap:
            name: openshift-service-ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-inference-gateway
  namespace: fleet-llm-d
spec:
  selector:
    app.kubernetes.io/name: fleet-inference-gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9091, targetPort: metrics}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fleet-inference-gateway
  namespace: fleet-llm-d
  annotations:
    haproxy.router.openshift.io/timeout: 180s
spec:
  to: {kind: Service, name: fleet-inference-gateway}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleet-inference-gateway
  namespace: fleet-llm-d
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-inference-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-inference-gateway-egress
  namespace: fleet-llm-d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-inference-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 172.30.0.10/32
        - ipBlock:
            cidr: 10.128.0.0/14
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    - to:
        - podSelector:
            matchLabels:
              app: fleet-postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-ai
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - podSelector:
            matchLabels:
              app: ovms-granite-2b
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: llm-d-semantic-classifier
      ports:
        - {protocol: TCP, port: 50051}
    - to:
        - ipBlock: {cidr: 192.168.1.106/32}
        - ipBlock: {cidr: 192.168.1.75/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immutable-ledger
      ports:
        - {protocol: TCP, port: 443}

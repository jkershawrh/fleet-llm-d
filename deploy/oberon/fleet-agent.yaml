apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-agent
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: fleet-agent
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/fleet-agent:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLEET_CONTROL_PLANE_URL
              value: http://fleet-controller.fleet-llm-d.svc:8080
            - name: FLEET_CLUSTER_ID
              value: oberon-sno
            - name: FLEET_PROXY_PORT
              value: "8090"
          ports:
            - name: proxy
              containerPort: 8090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: proxy
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: proxy
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-agent
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fleet-agent
    app.kubernetes.io/component: agent
  ports:
    - name: proxy
      port: 8090
      targetPort: proxy
      protocol: TCP

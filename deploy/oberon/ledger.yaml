---
apiVersion: v1
kind: Namespace
metadata:
  name: immutable-ledger
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-db-pvc
  namespace: immutable-ledger
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-db
  namespace: immutable-ledger
  labels:
    app: ledger-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-db
  template:
    metadata:
      labels:
        app: ledger-db
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: POSTGRESQL_USER
              value: ledger
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-postgres-credentials
                  key: password
            - name: POSTGRESQL_DATABASE
              value: are_ledger
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ledger-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: immutable-ledger
spec:
  selector:
    app: ledger-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-gateway
  namespace: immutable-ledger
  labels:
    app: ledger-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-gateway
  template:
    metadata:
      labels:
        app: ledger-gateway
    spec:
      containers:
        - name: gateway
          image: image-registry.openshift-image-registry.svc:5000/immutable-ledger/are-ledger-gateway:latest
          env:
            - name: LEDGER_GRPC_ENDPOINT
              value: "localhost:9092"
            - name: LEDGER_ENDPOINT
              value: "localhost:9092"
            - name: GATEWAY_PORT
              value: "28099"
            - name: GATEWAY_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 28099
              name: http
          readinessProbe:
            httpGet:
              path: /api/summary
              port: 28099
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: ledger-core
          image: image-registry.openshift-image-registry.svc:5000/immutable-ledger/are-immutable-ledger:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-postgres-credentials
                  key: database-url
            - name: ARE_LEDGER_DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: ledger-postgres-credentials
                  key: database-url
            - name: ARE_LEDGER_GRPC_PORT
              value: "9092"
            - name: ARE_LEDGER_HEALTH_PORT
              value: "8080"
          ports:
            - containerPort: 9092
              name: grpc
            - containerPort: 8080
              name: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-gateway
  namespace: immutable-ledger
spec:
  selector:
    app: ledger-gateway
  ports:
    - port: 28099
      targetPort: 28099
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-core
  namespace: immutable-ledger
spec:
  selector:
    app: ledger-gateway
  ports:
    - port: 9092
      targetPort: 9092
      name: grpc

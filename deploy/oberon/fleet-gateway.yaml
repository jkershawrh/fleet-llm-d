apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-gateway
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet-gateway
          image: quay.io/rh-ee-jkershaw/fleet-gateway:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: FLEET_CONTROL_PLANE_URL
              value: http://fleet-controller.fleet-llm-d.svc:8080
            - name: FLEET_GATEWAY_PORT
              value: "8080"
            - name: FLEET_HEALTH_PORT
              value: "8081"
            - name: FLEET_METRICS_PORT
              value: "9090"
            - name: FLEET_LB_STRATEGY
              value: weighted
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-gateway
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: fleet-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fleet-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-ai-config
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: fleet-llm-d
data:
  praxis-ai-config.yaml: |
    # Praxis AI Gateway Configuration for fleet-llm-d
    #
    # Routes inference requests across 3-cluster fleet:
    #   Oberon (CPU/OVMS) — local cluster DNS
    #   Arena  (CPU/OVMS) — cross-cluster via OpenShift Route
    #   Brutus (GPU/vLLM) — cross-cluster via OpenShift Route

    listeners:
      - name: fleet-inference-gateway
        address: "0.0.0.0:8080"
        filter_chains:
          - inference-pipeline

    filter_chains:
      - name: inference-pipeline
        filters:
          - filter: model_to_header
            header: X-AI-Model

          - filter: router
            routes:
              # --- Oberon-local backends (cluster DNS) ---

              # Granite 2B (OVMS, fast CPU inference)
              - path_prefix: "/v1/"
                headers:
                  x-ai-model: "granite-sovereign"
                cluster: ovms-granite-2b
              - path_prefix: "/v3/"
                headers:
                  x-ai-model: "granite-sovereign"
                cluster: ovms-granite-2b

              # Granite 2B by OVMS name
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-2b-cpu"
                cluster: ovms-granite-2b

              # Granite 8B (OVMS, larger model)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-8b"
                cluster: ovms-granite-8b

              # Granite 4.1 3B (OVMS)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-41-3b"
                cluster: ovms-granite41-3b

              # Granite 3.3 2B (vLLM CPU, slower)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-3.3-2b"
                cluster: vllm-granite

              # --- Cross-cluster backends ---

              # Arena: Granite 2B CPU (cross-cluster OVMS)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-2b-arena"
                cluster: arena-granite-2b

              # Brutus: Granite 8B GPU (cross-cluster vLLM on H100)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-8b-gpu"
                cluster: brutus-granite-8b-gpu

              # Brutus: Granite 8B GPU (by vLLM model name)
              - path_prefix: "/"
                headers:
                  x-ai-model: "ibm-granite/granite-3.1-8b-instruct"
                cluster: brutus-granite-8b-gpu

              # Default: route to fastest Oberon OVMS backend
              - path_prefix: "/"
                cluster: ovms-granite-2b

          - filter: token_count
            provider: openai

          - filter: token_usage_headers

          - filter: access_log

          - filter: load_balancer
            clusters:
              # Default Granite 2B CPU traffic stays on the healthy local backend.
              # Arena remains available through its explicit model route below;
              # do not add it here without active endpoint health ejection.
              - name: ovms-granite-2b
                endpoints:
                  - "ovms-granite-2b.fleet-llm-d.svc:8080"
              - name: ovms-granite-8b
                endpoints:
                  - "ovms-granite-8b.fleet-llm-d.svc:8080"
              - name: ovms-granite41-3b
                endpoints:
                  - "ovms-granite41-3b.fleet-llm-d.svc:8080"
              - name: vllm-granite
                endpoints:
                  - "granite-real.fleet-llm-d.svc:8000"
              # Arena cross-cluster (via K8s external service → Arena NodePort 30106)
              - name: arena-granite-2b
                endpoints:
                  - "arena-ovms-external.fleet-llm-d.svc:8080"
              # Brutus cross-cluster (via K8s external service → Brutus NodePort 32712)
              - name: brutus-granite-8b-gpu
                endpoints:
                  - "brutus-vllm-external.fleet-llm-d.svc:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-ai
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: praxis-ai
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/praxis-ai:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - "--config=/etc/praxis/praxis-ai-config.yaml"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-ai-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  selector:
    app.kubernetes.io/name: praxis-ai
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
spec:
  to:
    kind: Service
    name: praxis-ai
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

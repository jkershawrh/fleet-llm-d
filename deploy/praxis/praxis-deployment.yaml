apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-ai-config
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: fleet-llm-d
data:
  praxis-ai-config.yaml: |
    # Praxis AI Gateway Configuration for fleet-llm-d
    #
    # Routes inference requests across 3-cluster fleet:
    #   Oberon (CPU/OVMS) — local cluster DNS
    #   Arena  (CPU/OVMS) — cross-cluster via OpenShift Route
    #   Brutus (GPU/vLLM) — cross-cluster via OpenShift Route

    admin:
      address: "0.0.0.0:9901"

    # Admin is pod-local in practice: port 9901 is absent from the Service and
    # denied by NetworkPolicy. Non-loopback binding is required for kubelet probes.
    insecure_options:
      allow_public_admin: true

    listeners:
      - name: fleet-inference-gateway
        address: "0.0.0.0:8080"
        filter_chains:
          - inference-pipeline

    filter_chains:
      - name: inference-pipeline
        filters:
          - filter: model_to_header
            header: X-AI-Model

          - filter: router
            routes:
              # Trusted decisions from the fleet inference gateway take
              # precedence over model fallbacks. NetworkPolicy prevents
              # public callers from reaching this listener directly.
              - path_prefix: "/"
                headers:
                  x-fleet-target-cluster: "oberon"
                cluster: oberon-cpu
              - path_prefix: "/"
                headers:
                  x-fleet-target-cluster: "arena"
                cluster: arena-cpu
              - path_prefix: "/"
                headers:
                  x-fleet-target-cluster: "brutus"
                cluster: brutus-gpu
              # --- Oberon-local backends (cluster DNS) ---

              # Granite 2B (OVMS, fast CPU inference)
              - path_prefix: "/v1/"
                headers:
                  x-ai-model: "granite-sovereign"
                cluster: ovms-granite-2b
              - path_prefix: "/v3/"
                headers:
                  x-ai-model: "granite-sovereign"
                cluster: ovms-granite-2b

              # Granite 2B by OVMS name
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-2b-cpu"
                cluster: ovms-granite-2b

              # Granite 8B (OVMS, larger model)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-8b"
                cluster: ovms-granite-8b

              # Granite 4.1 3B (OVMS)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-41-3b"
                cluster: ovms-granite41-3b

              # Granite 3.3 2B (vLLM CPU, slower)
              - path_prefix: "/"
                headers:
                  x-ai-model: "granite-3.3-2b"
                cluster: vllm-granite

              # --- Cross-cluster backends ---

              # Brutus: Granite 8B GPU (by vLLM model name)
              - path_prefix: "/"
                headers:
                  x-ai-model: "ibm-granite/granite-3.1-8b-instruct"
                cluster: brutus-granite-8b-gpu

              # Default: route to fastest Oberon OVMS backend
              - path_prefix: "/"
                cluster: ovms-granite-2b

          - filter: token_count
            provider: openai

          - filter: token_usage_headers

          - filter: access_log

          - filter: load_balancer
            clusters:
              - name: oberon-cpu
                endpoints:
                  - "ovms-granite-2b.fleet-llm-d.svc:8080"
                max_connections: 100
                health_check:
                  type: http
                  path: "/v2/health/ready"
                  interval_ms: 5000
                  timeout_ms: 2000
                  healthy_threshold: 2
                  unhealthy_threshold: 3
                  passive_unhealthy_threshold: 3
                  passive_healthy_threshold: 2
              - name: arena-cpu
                endpoints:
                  - "ovms-granite-2b-fleet-llm-d.apps.arena.fm2aihpcsed.com:443"
                tls:
                  sni: "ovms-granite-2b-fleet-llm-d.apps.arena.fm2aihpcsed.com"
                  verify: true
                total_connection_timeout_ms: 5000
                read_timeout_ms: 180000
                max_connections: 100
                health_check:
                  type: http
                  path: "/v2/health/ready"
                  interval_ms: 5000
                  timeout_ms: 2000
                  healthy_threshold: 2
                  unhealthy_threshold: 3
                  passive_unhealthy_threshold: 3
                  passive_healthy_threshold: 2
              - name: brutus-gpu
                endpoints:
                  - "vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com:443"
                tls:
                  sni: "vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com"
                  verify: true
                total_connection_timeout_ms: 5000
                read_timeout_ms: 180000
                max_connections: 32
                health_check:
                  type: http
                  path: "/health"
                  interval_ms: 5000
                  timeout_ms: 2000
                  healthy_threshold: 2
                  unhealthy_threshold: 3
                  passive_unhealthy_threshold: 3
                  passive_healthy_threshold: 2
              # Granite 2B CPU — load-balanced across Oberon + Arena.
              - name: ovms-granite-2b
                endpoints:
                  - "ovms-granite-2b.fleet-llm-d.svc:8080"
              - name: ovms-granite-8b
                endpoints:
                  - "ovms-granite-8b.fleet-llm-d.svc:8080"
              - name: ovms-granite41-3b
                endpoints:
                  - "ovms-granite41-3b.fleet-llm-d.svc:8080"
              - name: vllm-granite
                endpoints:
                  - "granite-real.fleet-llm-d.svc:8000"
              # Compatibility model route; trusted gateway traffic uses brutus-gpu.
              - name: brutus-granite-8b-gpu
                endpoints:
                  - "vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com:443"
                tls:
                  sni: "vllm-granite-8b-gpu-fleet-llm-d.apps.brutus.fm2aihpcsed.com"
                  verify: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-ai
        app.kubernetes.io/part-of: fleet-llm-d
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-ai
      containers:
        - name: praxis-ai
          image: image-registry.openshift-image-registry.svc:5000/fleet-llm-d/praxis-ai:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - "--config=/etc/praxis/praxis-ai-config.yaml"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9901
              name: admin
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthy
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-ai-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: praxis-ai
    app.kubernetes.io/part-of: fleet-llm-d
spec:
  selector:
    app.kubernetes.io/name: praxis-ai
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
spec:
  to:
    kind: Service
    name: praxis-ai
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: praxis-ai
  namespace: fleet-llm-d
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
